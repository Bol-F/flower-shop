[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "backend/.venv",
    "backend/**/migrations",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/*.py" = ["F403", "F405"]
